<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算器</title>
<style>
  /* ===== CSS Custom Properties (Dark Theme) ===== */
  :root {
    --bg-body: #1c1c1e;
    --bg-calculator: #2c2c2e;
    --display-bg: #1c1c1e;
    --display-text: #ffffff;
    --btn-number-bg: #505054;
    --btn-number-hover: #636367;
    --btn-number-active: #3a3a3c;
    --btn-operator-bg: #ff9f0a;
    --btn-operator-hover: #ffb340;
    --btn-operator-active: #d68000;
    --btn-equals-bg: #ff9f0a;
    --btn-equals-hover: #ffb340;
    --btn-equals-active: #d68000;
    --btn-clear-bg: #3a3a3c;
    --btn-clear-hover: #4a4a4c;
    --btn-clear-active: #2a2a2c;
    --btn-backspace-bg: #3a3a3c;
    --btn-backspace-hover: #4a4a4c;
    --btn-backspace-active: #2a2a2c;
    --btn-text: #ffffff;
    --btn-operator-text: #ffffff;
    --border-radius: 12px;
    --btn-radius: 8px;
    --gap: 8px;
    --max-width: 360px;
  }

  /* ===== Reset & Base ===== */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: var(--bg-body);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== Calculator Container ===== */
  .calculator {
    background: var(--bg-calculator);
    border-radius: var(--border-radius);
    padding: 20px;
    width: 100%;
    max-width: var(--max-width);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  /* ===== Display ===== */
  .display {
    background: var(--display-bg);
    border-radius: var(--btn-radius);
    padding: 16px 20px;
    margin-bottom: 16px;
    min-height: 80px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    overflow: hidden;
  }

  .display-text {
    color: var(--display-text);
    font-size: 2.5rem;
    font-weight: 300;
    line-height: 1.2;
    text-align: right;
    word-break: break-all;
    transition: font-size 0.15s ease;
  }

  .display-text.small {
    font-size: 1.8rem;
  }

  .display-text.error {
    color: #ff453a;
    font-size: 1.5rem;
  }

  /* ===== Button Grid ===== */
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--gap);
  }

  /* ===== Button Base ===== */
  button {
    border: none;
    border-radius: var(--btn-radius);
    padding: 18px 0;
    font-size: 1.4rem;
    font-weight: 400;
    cursor: pointer;
    transition: background 0.1s, transform 0.08s;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }

  button:active {
    transform: scale(0.94);
  }

  /* ===== Number Buttons ===== */
  .btn-number {
    background: var(--btn-number-bg);
    color: var(--btn-text);
  }
  .btn-number:hover {
    background: var(--btn-number-hover);
  }
  .btn-number:active {
    background: var(--btn-number-active);
  }

  /* ===== Operator Buttons ===== */
  .btn-operator {
    background: var(--btn-operator-bg);
    color: var(--btn-operator-text);
  }
  .btn-operator:hover {
    background: var(--btn-operator-hover);
  }
  .btn-operator:active {
    background: var(--btn-operator-active);
  }

  /* ===== Equals Button ===== */
  .btn-equals {
    background: var(--btn-equals-bg);
    color: var(--btn-operator-text);
  }
  .btn-equals:hover {
    background: var(--btn-equals-hover);
  }
  .btn-equals:active {
    background: var(--btn-equals-active);
  }

  /* ===== Clear Button ===== */
  .btn-clear {
    background: var(--btn-clear-bg);
    color: var(--btn-text);
  }
  .btn-clear:hover {
    background: var(--btn-clear-hover);
  }
  .btn-clear:active {
    background: var(--btn-clear-active);
  }

  /* ===== Backspace Button ===== */
  .btn-backspace {
    background: var(--btn-backspace-bg);
    color: var(--btn-text);
    grid-column: span 3;
  }
  .btn-backspace:hover {
    background: var(--btn-backspace-hover);
  }
  .btn-backspace:active {
    background: var(--btn-backspace-active);
  }

  /* ===== Keyboard Highlight ===== */
  button.highlight {
    filter: brightness(1.3);
    transform: scale(0.94);
  }

  /* ===== Responsive Media Queries ===== */
  @media (max-width: 400px) {
    .calculator {
      padding: 12px;
      border-radius: 8px;
    }
    .display {
      min-height: 64px;
      padding: 12px 16px;
    }
    .display-text {
      font-size: 2rem;
    }
    .display-text.small {
      font-size: 1.4rem;
    }
    button {
      padding: 14px 0;
      font-size: 1.2rem;
    }
  }

  @media (min-width: 768px) {
    .calculator {
      padding: 28px;
    }
    .display-text {
      font-size: 3rem;
    }
    button {
      padding: 22px 0;
      font-size: 1.6rem;
    }
  }
</style>
</head>
<body>

<div class="calculator" role="application" aria-label="计算器">
  <!-- Display -->
  <div class="display" aria-live="polite">
    <div class="display-text" id="display">0</div>
  </div>

  <!-- Button Grid -->
  <div class="buttons">
    <button class="btn-number" data-value="7">7</button>
    <button class="btn-number" data-value="8">8</button>
    <button class="btn-number" data-value="9">9</button>
    <button class="btn-operator" data-value="÷">÷</button>

    <button class="btn-number" data-value="4">4</button>
    <button class="btn-number" data-value="5">5</button>
    <button class="btn-number" data-value="6">6</button>
    <button class="btn-operator" data-value="×">×</button>

    <button class="btn-number" data-value="1">1</button>
    <button class="btn-number" data-value="2">2</button>
    <button class="btn-number" data-value="3">3</button>
    <button class="btn-operator" data-value="−">−</button>

    <button class="btn-number" data-value="0">0</button>
    <button class="btn-number" data-value=".">.</button>
    <button class="btn-clear" id="btnClear">C</button>
    <button class="btn-operator" data-value="+">+</button>

    <button class="btn-backspace" id="btnBackspace">⌫</button>
    <button class="btn-equals" id="btnEquals">=</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ===== State =====
  let currentInput = '0';
  let previousOperand = null;
  let pendingOperator = null;
  let shouldResetDisplay = false;
  let hasError = false;

  // ===== DOM References =====
  const display = document.getElementById('display');

  // ===== Display Update =====
  function updateDisplay() {
    if (hasError) {
      display.textContent = '错误';
      display.className = 'display-text error';
      return;
    }
    display.textContent = currentInput;
    display.className = 'display-text';
    if (currentInput.length > 12) {
      display.classList.add('small');
    }
  }

  // ========== Number & Decimal Input ==========
  function inputDigit(digit) {
    if (hasError) return;
    if (shouldResetDisplay) {
      currentInput = digit;
      shouldResetDisplay = false;
    } else {
      if (digit === '.' && currentInput.includes('.')) return;
      if (currentInput === '0' && digit !== '.') {
        currentInput = digit;
      } else {
        currentInput += digit;
      }
    }
    updateDisplay();
  }

  // ========== Operator Input ==========
  function inputOperator(op) {
    if (hasError) return;
    const current = parseFloat(currentInput);

    if (pendingOperator !== null && !shouldResetDisplay) {
      const result = compute(previousOperand, current, pendingOperator);
      currentInput = String(result);
      previousOperand = result;
    } else {
      previousOperand = current;
    }

    pendingOperator = op;
    shouldResetDisplay = true;
    updateDisplay();
  }

  // ========== Calculation Engine ==========
  function compute(a, b, operator) {
    switch (operator) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷':
        if (b === 0) {
          hasError = true;
          updateDisplay();
          return NaN;
        }
        return a / b;
      default: return b;
    }
  }

  // ========== Equals ==========
  function inputEquals() {
    if (hasError) return;
    if (pendingOperator === null) {
      shouldResetDisplay = true;
      return;
    }

    const current = parseFloat(currentInput);
    const result = compute(previousOperand, current, pendingOperator);

    if (!hasError) {
      // Round to avoid floating-point artifacts
      const rounded = parseFloat(result.toPrecision(12));
      currentInput = String(rounded);
      previousOperand = null;
      pendingOperator = null;
      shouldResetDisplay = true;
      updateDisplay();
    }
  }

  // ========== Clear ==========
  function inputClear() {
    currentInput = '0';
    previousOperand = null;
    pendingOperator = null;
    shouldResetDisplay = false;
    hasError = false;
    updateDisplay();
  }

  // ========== Backspace ==========
  function inputBackspace() {
    if (hasError || shouldResetDisplay) return;
    if (currentInput.length === 1 || (currentInput.length === 2 && currentInput.startsWith('-'))) {
      currentInput = '0';
    } else {
      currentInput = currentInput.slice(0, -1);
    }
    updateDisplay();
  }

  // ========== Button Click Handlers ==========
  document.querySelectorAll('.btn-number').forEach(function(btn) {
    btn.addEventListener('click', function() {
      inputDigit(this.getAttribute('data-value'));
    });
  });

  document.querySelectorAll('.btn-operator').forEach(function(btn) {
    btn.addEventListener('click', function() {
      inputOperator(this.getAttribute('data-value'));
    });
  });

  document.getElementById('btnClear').addEventListener('click', inputClear);
  document.getElementById('btnBackspace').addEventListener('click', inputBackspace);
  document.getElementById('btnEquals').addEventListener('click', inputEquals);

  // ========== Keyboard Input ==========
  const keyMap = {
    '0': 'digit', '1': 'digit', '2': 'digit', '3': 'digit', '4': 'digit',
    '5': 'digit', '6': 'digit', '7': 'digit', '8': 'digit', '9': 'digit',
    '.': 'digit',
    '+': 'operator', '-': 'operator', '*': 'operator', '/': 'operator',
    'Enter': 'equals', '=': 'equals',
    'Backspace': 'backspace',
    'Escape': 'clear', 'Delete': 'clear'
  };

  const operatorMapping = {
    '+': '+', '-': '−', '*': '×', '/': '÷'
  };

  document.addEventListener('keydown', function(e) {
    const key = e.key;
    const action = keyMap[key];

    if (!action) return;
    e.preventDefault();

    // Highlight matching button
    const button = findButtonForKey(key, action);
    if (button) {
      button.classList.add('highlight');
      setTimeout(function() { button.classList.remove('highlight'); }, 150);
    }

    switch (action) {
      case 'digit':
        inputDigit(key);
        break;
      case 'operator':
        inputOperator(operatorMapping[key] || key);
        break;
      case 'equals':
        inputEquals();
        break;
      case 'backspace':
        inputBackspace();
        break;
      case 'clear':
        inputClear();
        break;
    }
  });

  function findButtonForKey(key, action) {
    if (action === 'digit') {
      return document.querySelector('.btn-number[data-value="' + key + '"]');
    }
    if (action === 'operator') {
      const mapped = operatorMapping[key] || key;
      return document.querySelector('.btn-operator[data-value="' + mapped + '"]');
    }
    if (action === 'equals') {
      return document.getElementById('btnEquals');
    }
    if (action === 'backspace') {
      return document.getElementById('btnBackspace');
    }
    if (action === 'clear') {
      return document.getElementById('btnClear');
    }
    return null;
  }
})();
</script>
</body>
</html>
